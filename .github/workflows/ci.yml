name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 2026-11-25 (PR #1): the production fixes made config/secrets
    # fail-loud without DynamoDB. CI has no DynamoDB, so tests run in
    # explicit in-memory dev mode. These flags are test-only; they do
    # NOT enable any mock/demo fallback in production code.
    env:
      ALLOW_IN_MEMORY_CONFIG: "1"
      ALLOW_IN_MEMORY_SECRETS: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite (62 tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
