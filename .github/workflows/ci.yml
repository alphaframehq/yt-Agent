name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 2026-11-25 (DynamoDB -> Google Sheets migration): CI has no
    # Google Sheets credentials. Tests mock the Sheets client
    # (tests/_sheets_fake.py) instead of touching any live store, and
    # secrets come from env vars set inside the tests. No live store
    # is ever used in CI.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
