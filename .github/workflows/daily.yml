name: TubePilot AI Daily Automation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Specific Topic to Research & Produce (leave blank to pop from Queue)'
        required: false
        default: ''
        type: string
      pillar:
        description: 'Content Pillar'
        required: true
        default: 'ai_everything'
        type: choice
        options:
          - 'ai_everything'
          - 'finance_to_technical'
          - 'tech_to_financial'
      shorts_count:
        description: 'Shorts to produce from the same topic (0 = long video only)'
        required: false
        default: '3'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'

permissions:
  contents: read

jobs:
  produce-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GH_REPO_OWNER: "alphaframehq"
      GH_REPO_NAME: "yt-Agent"
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-2' }}
      AWS_REGION: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION || 'us-east-2' }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      # 27 Nov 2026 (TTS fix, runs #19/#20): second Gemini key from a      
      # different GCP project — tools/secrets.py rotates GEMINI_KEY_1..20      
      # on 429. Without this export the runner pool stays at 1 key.      
      GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}      
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Google Sheets Tabs & Config
        run: |
          python -c "from db.setup_sheets import setup_all_sheets; setup_all_sheets()"
          python -c "from storage.ephemeral import startup_orphan_sweep; startup_orphan_sweep()"

      - name: Run Daily Output — 1 Long Video + 3 Shorts (With Retry for Network Resilience)
        id: run_pipeline
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 40
          max_attempts: 2
          retry_on: error
          command: |
            python -u scripts/daily_run.py \
              ${{ inputs.topic && format('--topic "{0}"', inputs.topic) || '' }} \
              --pillar ${{ inputs.pillar || 'ai_everything' }} \
              --shorts-count ${{ inputs.shorts_count || '3' }} \
              --scheduled \
              --no-stop

      - name: Notify Success on Telegram
        if: success()
        run: |
          python scripts/notify.py "✅ *TubePilot AI Daily Run Completed Successfully!* 1 long video + 3 Shorts uploaded private to YouTube and registered in Google Sheets (long video in yt_videos, Shorts in yt_shorts, trends in yt_trends)."

      - name: Notify Failure on Telegram
        if: failure()
        run: |
          python scripts/notify_failure.py "daily_workflow" "GitHub Actions Daily Job Failed. Inspect runner logs." "${{ github.run_id }}" "${{ inputs.topic || 'Daily Scheduled Run' }}"
